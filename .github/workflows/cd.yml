name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  build:
    name: Build and Publish
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="${{ env.IMAGE_NAME }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"
          echo "Image $IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            .

      - name: Push image
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

  deploy-staging:
    name: Deploy Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact release artifact
        run: |
          docker pull "${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}"

      - name: Start staging container
        run: |
          docker run -d \
            --name mlops-staging \
            -p 5000:5000 \
            "${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}"

      - name: Smoke test staging
        run: |
          sleep 5
          curl --fail http://127.0.0.1:5000/health

      - name: Show staging logs
        if: always()
        run: docker logs mlops-staging || true

  deploy-production:
    name: Deploy Production
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull same tested artifact
        run: |
          docker pull "${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}"

      - name: Start production container
        run: |
          docker run -d \
            --name mlops-production \
            -p 5001:5000 \
            "${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}"

      - name: Verify production
        run: |
          sleep 5
          curl --fail http://127.0.0.1:5001/health